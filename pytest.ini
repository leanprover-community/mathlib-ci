[pytest]
# Each directory under `tests/` is an independent suite with its own workflow that
# runs `pytest tests/<suite>`; `testpaths` lets a bare `pytest` collect them all.
#
# Test file basenames must be unique ACROSS suites.  pytest imports test modules in
# its default `prepend` mode, which makes the module name the bare basename, so two
# files with the same name anywhere under `tests/` make whole-tree collection fail
# with "import file mismatch".  Do not switch to `--import-mode=importlib` to dodge
# this: that mode stops putting each suite's directory on `sys.path`, which breaks
# `tests/zulip_emoji`'s `from conftest import SAMPLE_CONFIG_DATA`.
testpaths = tests
