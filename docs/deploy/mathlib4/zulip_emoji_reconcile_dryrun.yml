name: Zulip emoji reconcile (dry-run sweep)

# TEMPORARY validation workflow.
#
# Checks out leanprover-community/mathlib-ci at the feature branch
# `zulip-emoji-reconcile` and runs the new reconciler in --dry-run mode, so we can
# eyeball the desired-vs-actual emoji diff on real mathlib4 data before any live writes.
# It performs NO Zulip mutations and NO GitHub writes (reads only).
#
# Remove this file once the composite-action trigger stubs land.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which path to exercise"
        type: choice
        options: [sweep, pr]
        default: sweep
      pr:
        description: "PR number (only used when mode = pr)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (log the plan, write nothing). Keep true while validating."
        type: boolean
        default: true
      sweep_messages:
        description: "Recent messages to scan per channel (sweep mode)"
        type: string
        default: "5000"

# Read-only: the reconciler only needs to read PR state; emoji writes go to Zulip, not GitHub.
permissions:
  contents: read
  pull-requests: read

jobs:
  reconcile:
    if: github.repository == 'leanprover-community/mathlib4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mathlib4 (for the config file)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          sparse-checkout: .github/zulip-emoji-config.json
          sparse-checkout-cone-mode: false

      - name: Checkout mathlib-ci (feature branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: leanprover-community/mathlib-ci
          # TEMPORARY: pinned to the feature branch for validation. The real stubs will use
          # the get-mathlib-ci action's pinned ref instead.
          ref: zulip-emoji-reconcile
          fetch-depth: 1
          path: ci-tools

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-tools/scripts/zulip/requirements.txt

      - name: Run reconciler (dry-run by default)
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          PR: ${{ inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run }}
          SWEEP_MESSAGES: ${{ inputs.sweep_messages }}
        run: |
          args=(--config .github/zulip-emoji-config.json)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$MODE" = "pr" ]; then
            if [ -z "$PR" ]; then
              echo "::error::mode=pr requires a PR number"
              exit 1
            fi
            args+=(--pr "$PR")
          else
            args+=(--sweep --sweep-messages "$SWEEP_MESSAGES")
          fi
          echo "Running: reconcile_emojis.py ${args[*]}"
          python ci-tools/scripts/zulip/reconcile_emojis.py "${args[@]}"
