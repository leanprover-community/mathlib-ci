name: Broker Create Credentials
description: >-
  Exchange the job's GitHub OIDC token at a credential broker for
  short-lived S3-compatible credentials, and expose them as masked step
  outputs. The broker decides from the token's claims which grant
  applies. The caller maps the outputs into the variables its tool
  reads. The calling job needs `id-token: write`.

inputs:
  broker-url:
    description: >-
      URL of the broker's credential endpoint (https, no query string,
      no trailing slash).
    required: true
  audience:
    description: OIDC audience the broker expects.
    required: true
  on-failure:
    description: >-
      Posture when the mint fails. "warn-and-skip" warns and sets no
      outputs, so the caller's fallback path carries the run; "fail"
      fails the step. Use "fail" when the caller has no fallback.
    required: false
    default: warn-and-skip

outputs:
  access-key-id:
    description: The S3 access key id. Masked.
    value: ${{ steps.mint.outputs.access-key-id }}
  secret-access-key:
    description: The S3 secret access key. Masked.
    value: ${{ steps.mint.outputs.secret-access-key }}
  session-token:
    description: The S3 session token, sent as x-amz-security-token. Masked.
    value: ${{ steps.mint.outputs.session-token }}
  grant:
    description: The name of the broker grant that matched the token. Display-only.
    value: ${{ steps.mint.outputs.grant }}
  minted:
    description: >-
      "true" when the credential outputs are set; unset when the mint
      failed in the warn-and-skip posture. Gate the steps that use the
      credential on it.
    value: ${{ steps.mint.outputs.minted }}

runs:
  using: composite
  steps:
    - name: Mint credentials from the broker
      id: mint
      shell: bash
      # Inputs flow through `env:`, never `${{ … }}` inside `run:`:
      # GitHub expands `${{ … }}` into the script before bash sees it.
      # On success the script masks the credentials, then writes the
      # outputs to GITHUB_OUTPUT in one block.
      env:
        BROKER_URL: ${{ inputs.broker-url }}
        AUDIENCE: ${{ inputs.audience }}
        ON_FAILURE: ${{ inputs.on-failure }}
      run: |
        python3 "${{ github.action_path }}/mint.py" \
          --broker-url "$BROKER_URL" \
          --audience "$AUDIENCE" \
          --on-failure "$ON_FAILURE" \
          --github-output "$GITHUB_OUTPUT"
