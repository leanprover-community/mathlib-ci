name: Test mint-s3-credentials action

# Runs the unit-test suite for the `mint-s3-credentials`
# composite action on every push / PR that touches its source or its
# tests.

on:
  push:
    branches: [master]
    paths:
      - .github/actions/mint-s3-credentials/**
      - tests/mint_s3_credentials/**
      - .github/workflows/test_mint_s3_credentials.yml
  pull_request:
    paths:
      - .github/actions/mint-s3-credentials/**
      - tests/mint_s3_credentials/**
      - .github/workflows/test_mint_s3_credentials.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/mint_s3_credentials -v
