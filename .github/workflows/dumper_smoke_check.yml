name: Dumper smoke check

# Runs `dumpReasonableDecls.lean` in a checkout of mathlib4 master, weekly and on every push or
# PR that touches it. mathlib4 pins this repository by commit, so a change here cannot break
# mathlib until the pin moves; but a toolchain bump on mathlib's side can break the pinned
# script, and this shows it first. It fails when:
#
# * the script does not compile;
# * the API dump's header leaves out a field: the dumper does that, with a warning, when an
#   extension it reads reads as empty, which after a toolchain bump can happen silently
#   (`dumpReasonableDecls.lean`, *Extensions read as empty*).
#
# A failure of the weekly run or of a push to master is posted to Zulip, in
# #nightly-testing-mathlib > "API dumper smoke check failure", with what failed and the output
# that says why. A failure on a PR or a manual run only shows in the run.

on:
  push:
    branches: [master]
    paths:
      - scripts/pr_summary/dumpReasonableDecls.lean
      - scripts/pr_summary/apiDump.py
      - .github/workflows/dumper_smoke_check.yml
  pull_request:
    paths:
      - scripts/pr_summary/dumpReasonableDecls.lean
      - scripts/pr_summary/apiDump.py
      - .github/workflows/dumper_smoke_check.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mathlib-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci

      - name: Checkout mathlib4 master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leanprover-community/mathlib4
          ref: master
          path: mathlib4

      - name: Configure Lean
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: mathlib4

      # Only what the script imports, and the module it dumps: a few hundred files, not all of
      # Mathlib.
      - name: Fetch the oleans the script needs
        id: fetch
        working-directory: mathlib4
        run: |
          lake exe cache get Mathlib/Tactic/ToDual.lean Mathlib/Tactic/ToAdditive.lean \
            Mathlib/Order/Bounds/Basic.lean
          lake build ImportGraph.Imports.ImportGraph ImportGraph.Graph.TransitiveClosure \
            Batteries.Tactic.Alias Mathlib.Order.Bounds.Basic

      # Lean prints the script's compile errors on stdout, and the dumper its warnings on stderr;
      # both are kept for the Zulip report.
      - name: Dump Mathlib.Order.Bounds.Basic
        id: dump
        working-directory: mathlib4
        run: |
          set -o pipefail
          status=0
          lake env lean --run ../ci/scripts/pr_summary/dumpReasonableDecls.lean \
            --out-dir ../dump Mathlib.Order.Bounds.Basic 2>../dump.stderr | tee ../dump.stdout \
            || status=$?
          cat ../dump.stderr >&2
          exit "$status"

      - name: Check that the header lists every field
        id: check
        run: |
          python3 - <<'EOF'
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "ci/scripts/pr_summary")
          from apiDump import read_api

          src = Path("ci/scripts/pr_summary/dumpReasonableDecls.lean").read_text()
          body = re.search(r"def apiFields : List \(String × Nat\) :=\s*\[(.*?)\]", src, re.S)
          expected = {k: int(v) for k, v in re.findall(r'\("(\w+)", (\d+)\)', body.group(1))}
          api = read_api(Path("dump/api.jsonl"))
          missing = sorted(set(expected) - set(api.fields))
          problems = [ln for ln in Path("dump.stderr").read_text().splitlines()
                      if ln.startswith("warning:")]
          if missing:
              problems.append(f"the header leaves out {', '.join(missing)}")
          Path("check.errors").write_text("".join(f"{p}\n" for p in problems))
          for p in problems:
              print(f"::error::{p}")
          print(f"{len(api.decls)} declarations, fields {sorted(api.fields)}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Write the Zulip report
        id: report
        if: >-
          failure() && github.repository == 'leanprover-community/mathlib-ci'
          && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          FETCH: ${{ steps.fetch.outcome }}
          DUMP: ${{ steps.dump.outcome }}
          CHECK: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The earliest of the steps above that failed; the ones after it were skipped.
          # shellcheck disable=SC2016 # The backticks are literal Markdown.
          if [ "${DUMP}" = failure ]; then
            what='`dumpReasonableDecls.lean` failed on `Mathlib.Order.Bounds.Basic`'
            cat dump.stdout dump.stderr > details 2>/dev/null || true
          elif [ "${CHECK}" = failure ]; then
            what="the dumper warned, or the API dump's header leaves out a field"
            cp check.errors details 2>/dev/null || true
          elif [ "${FETCH}" = failure ]; then
            what='fetching or building the oleans the script needs failed'
          else
            what='a setup step failed'
          fi
          mathlib=$(git -C mathlib4 rev-parse HEAD 2>/dev/null) || mathlib=
          if [ -n "${mathlib}" ]; then
            against="mathlib4 [\`${mathlib:0:10}\`](${GITHUB_SERVER_URL}/leanprover-community/mathlib4/commit/${mathlib})"
          else
            against='mathlib4 master'
          fi
          ci="mathlib-ci [\`${GITHUB_SHA:0:10}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"

          # Zulip takes at most 10000 bytes; the output is cut at a line before 7000.
          limit=7000
          {
            echo "❌ The dumper smoke check [failed](${RUN_URL}) on ${against} with ${ci}: ${what}."
            if [ -s details ]; then
              echo
              echo '```spoiler Output'
              echo '~~~text'
              if [ "$(wc -c < details)" -gt "${limit}" ]; then
                printf '%s\n' "$(head -c "${limit}" details | sed '$d')"
                echo '… (cut: the full output is in the run log)'
              else
                printf '%s\n' "$(cat details)"
              fi
              echo '~~~'
              echo '```'
            fi
          } > report.md
          cat report.md

          delimiter=$(cat /proc/sys/kernel/random/uuid)
          {
            echo "message<<${delimiter}"
            cat report.md
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Post the report on Zulip
        if: failure() && steps.report.outcome == 'success'
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_MATHLIB_CI_BOT_API_KEY }}
          email: 'github-mathlib-ci-bot@leanprover.zulipchat.com'
          organization-url: 'https://leanprover.zulipchat.com'
          to: 'nightly-testing-mathlib'
          type: 'stream'
          topic: 'API dumper smoke check failure'
          content: ${{ steps.report.outputs.message }}
