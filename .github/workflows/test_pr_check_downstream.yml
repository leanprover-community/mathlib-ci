name: Test pr_check_downstream actions

# Runs the unit-test suite for the `check-downstream-validate` and
# `check-downstream-ack` composite actions on every push / PR that
# touches their source or their tests.

on:
  push:
    branches: [master]
    paths:
      - .github/actions/check-downstream-validate/**
      - .github/actions/check-downstream-ack/**
      - tests/pr_check_downstream/**
      - .github/workflows/test_pr_check_downstream.yml
      - pytest.ini
  pull_request:
    paths:
      - .github/actions/check-downstream-validate/**
      - .github/actions/check-downstream-ack/**
      - tests/pr_check_downstream/**
      - .github/workflows/test_pr_check_downstream.yml
      - pytest.ini

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/pr_check_downstream -v
