name: Test decls-diff scripts

# Runs the unit-test suite for `scripts/pr_summary/declsDiff.py` and the
# `decls-diff` composite action on every push / PR that touches their
# source or their tests.

on:
  push:
    branches: [master]
    paths:
      - .github/actions/secure-pip/**
      - scripts/pr_summary/declsDiff.py
      - .github/actions/decls-diff/**
      - tests/decls_diff/**
      - .github/workflows/test_decls_diff.yml
      - pytest.ini
  pull_request:
    paths:
      - .github/actions/secure-pip/**
      - scripts/pr_summary/declsDiff.py
      - .github/actions/decls-diff/**
      - tests/decls_diff/**
      - .github/workflows/test_decls_diff.yml
      - pytest.ini

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - uses: ./.github/actions/secure-pip
      - run: python3 -m pip install pytest
      - run: python3 -m pytest tests/decls_diff -v
