name: Test dependency update scripts

# Runs the unit-test suite for `scripts/dependencies/dependency_update_summary.py`
# on every push / PR that touches the script or its tests.

on:
  push:
    branches: [master]
    paths:
      - scripts/dependencies/**
      - tests/dependency_update_summary/**
      - .github/workflows/test_dependency_update_summary.yml
      - pytest.ini
  pull_request:
    paths:
      - scripts/dependencies/**
      - tests/dependency_update_summary/**
      - .github/workflows/test_dependency_update_summary.yml
      - pytest.ini

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/dependency_update_summary -v
