name: Test zulip emoji reconcile

# Runs the unit-test suite for the `emoji_reconcile` package (config schema,
# desired_emoji_set, the retrying Zulip client, and per-message reconciliation)
# on every push / PR that touches its source or its tests.

on:
  push:
    branches: [master]
    paths:
      - scripts/zulip/emoji_reconcile/**
      - scripts/zulip/reconcile_emojis.py
      - scripts/zulip/examples/**
      - tests/zulip_emoji/**
      - .github/workflows/test_zulip_emoji.yml
  pull_request:
    paths:
      - scripts/zulip/emoji_reconcile/**
      - scripts/zulip/reconcile_emojis.py
      - scripts/zulip/examples/**
      - tests/zulip_emoji/**
      - .github/workflows/test_zulip_emoji.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/zulip_emoji -v
