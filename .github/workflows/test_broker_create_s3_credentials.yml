name: Test broker-create-s3-credentials action

# Runs the unit-test suite for the `broker-create-s3-credentials`
# composite action on every push / PR that touches its source or its
# tests.

on:
  push:
    branches: [master]
    paths:
      - .github/actions/broker-create-s3-credentials/**
      - tests/broker_create_s3_credentials/**
      - .github/workflows/test_broker_create_s3_credentials.yml
  pull_request:
    paths:
      - .github/actions/broker-create-s3-credentials/**
      - tests/broker_create_s3_credentials/**
      - .github/workflows/test_broker_create_s3_credentials.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/broker_create_s3_credentials -v
