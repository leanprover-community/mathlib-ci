name: Test transitive-import counting

# Runs the unit-test suite for `scripts/pr_summary/count-trans-deps.py` on every
# push / PR that touches its source or its tests.

on:
  push:
    branches: [master]
    paths:
      - scripts/pr_summary/count-trans-deps.py
      - tests/trans_deps/**
      - .github/workflows/test_trans_deps.yml
      - pytest.ini
  pull_request:
    paths:
      - scripts/pr_summary/count-trans-deps.py
      - tests/trans_deps/**
      - .github/workflows/test_trans_deps.yml
      - pytest.ini

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - run: python3 -m pip install --upgrade pip pytest
      - run: python3 -m pytest tests/trans_deps -v
